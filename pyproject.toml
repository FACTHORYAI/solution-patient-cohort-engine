[project]
name = "patient_cohort_engine"
version = "0.1.0"
description = "Build and compare patient cohorts from clinical notes, as tables in Facthory: entity extraction, a knowledge graph as edge tables, and cohort queries."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "pyarrow>=17",
]

[project.scripts]
patient_cohort_engine = "patient_cohort_engine.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_cohort_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
